<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visualizador CSV - Orden con un botón</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        html, body {
            height: 100%;
            font-family: 'Segoe UI', sans-serif;
            background: #f4f7fc;
            overflow: hidden;
        }
        .container {
            display: flex;
            flex-direction: column;
            height: 100vh;
            max-width: 100%;
            background: white;
            padding: 15px 20px;
        }
        .header {
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 8px;
        }
        .header h1 {
            font-weight: 300;
            font-size: 1.5rem;
            color: #0b2b44;
            margin: 0;
        }
        .header .subtitle {
            color: #5e6f88;
            font-size: 0.85rem;
        }
        .upload-area {
            border: 2px dashed #b9c8dd;
            border-radius: 10px;
            padding: 8px 18px;
            background: #fafcff;
            cursor: pointer;
            transition: 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            flex-shrink: 0;
        }
        .upload-area:hover {
            border-color: #3b7cff;
            background: #f0f6ff;
        }
        .upload-area input {
            display: none;
        }
        .upload-label {
            font-size: 0.9rem;
            color: #2b4b6f;
        }
        .upload-label strong {
            color: #3b7cff;
            text-decoration: underline;
        }
        .file-name {
            font-weight: 500;
            color: #1d3b5c;
            font-size: 0.85rem;
        }
        .filter-note {
            background: #eef6ff;
            border-left: 4px solid #3b7cff;
            padding: 5px 14px;
            border-radius: 6px;
            font-size: 0.8rem;
            color: #1d3b5c;
            flex-shrink: 0;
            margin: 4px 0;
            display: none;
        }
        .table-wrapper {
            flex: 1 1 auto;
            overflow: auto;
            border-radius: 10px;
            border: 1px solid #e3eaf2;
            background: white;
            min-height: 0;
            position: relative;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.82rem;
        }
        thead {
            position: sticky;
            top: 0;
            z-index: 3;
        }
        th {
            background: #e9eff7;
            color: #1f3b57;
            font-weight: 600;
            padding: 6px 10px;
            text-align: left;
            white-space: nowrap;
            border-bottom: 1px solid #d0dbe8;
        }
        .sort-btn {
            background: none;
            border: none;
            cursor: pointer;
            font-size: 0.8rem;
            padding: 0 4px;
            margin-left: 6px;
            color: #889bb3;
            transition: 0.15s;
            vertical-align: middle;
        }
        .sort-btn:hover {
            color: #3b7cff;
        }
        .sort-btn.active-asc {
            color: #3b7cff;
            font-weight: bold;
        }
        .sort-btn.active-desc {
            color: #e74c3c;
            font-weight: bold;
        }
        td {
            padding: 6px 10px;
            border-bottom: 1px solid #eef3f9;
            max-width: 180px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        tr:hover td {
            background: #f8fbff;
        }
        .footer {
            flex-shrink: 0;
            text-align: center;
            font-size: 0.7rem;
            color: #889bb3;
            padding-top: 6px;
            border-top: 1px solid #e9edf4;
            margin-top: 6px;
        }
        #tableContainer {
            display: none;
            flex: 1 1 auto;
            min-height: 0;
            flex-direction: column;
        }
        #filterNote {
            display: none;
        }
        .warning {
            background: #fff3cd;
            border: 1px solid #ffc107;
            color: #856404;
            padding: 4px 12px;
            border-radius: 6px;
            font-size: 0.75rem;
            flex-shrink: 0;
            margin: 3px 0;
            display: none;
        }
        @media (max-width: 600px) {
            .container { padding: 8px 10px; }
            .header h1 { font-size: 1.1rem; }
            td { font-size: 0.7rem; padding: 4px 6px; }
            th { font-size: 0.75rem; padding: 4px 6px; }
            .sort-btn { font-size: 0.7rem; }
        }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <div>
            <h1>📊 Visualizador CSV</h1>
            <span class="subtitle">Ordená con un clic (ascendente / descendente)</span>
        </div>
        <div style="display:flex; align-items:center; gap:8px; flex-wrap:wrap;">
            <div class="upload-area" id="uploadArea">
                <div class="upload-label">📂 <strong>Selecciona</strong> o arrastra CSV</div>
                <input type="file" id="fileInput" accept=".csv">
                <span class="file-name" id="fileName"></span>
            </div>
        </div>
    </div>

    <div id="filterNote" class="filter-note">
        ⚡ Columnas: <strong id="shownColumnsList"></strong>
    </div>
    <div id="warningMessage" class="warning">⚠️ Más de 5000 filas – el rendimiento puede verse afectado.</div>

    <div id="tableContainer">
        <div class="table-wrapper" id="tableWrapper">
            <!-- Tabla generada con JS -->
        </div>
    </div>

    <div class="footer">Hecho por Juano</div>
</div>

<script>
    (function() {
        // ---------- COLUMNAS Y NOMBRES MOSTRADOS ----------
        const TARGET_COLUMNS = [
            'stock_brand', 'stock_model_version', 'stock_version', 'stock_domain',
            'stock_used_year', 'stock_color', 'stock_vehicle_kms', 'stock_location'
        ];

        const DISPLAY_NAMES = {
            'stock_brand': 'Marca',
            'stock_model_version': 'Modelo',
            'stock_version': 'Versión',
            'stock_domain': 'Patente',
            'stock_used_year': 'Año',
            'stock_color': 'Color',
            'stock_vehicle_kms': 'kms',
            'stock_location': 'Ubicación'
        };

        // ---------- LIMPIEZA ----------
        function cleanText(str) {
            if (!str) return '';
            let s = String(str).trim().toLowerCase();
            const corrections = {
                'biarco': 'blanco', 'blanca': 'blanco', 'blanco': 'blanco',
                'gris': 'gris', 'gris plata': 'gris plata', 'plateado': 'gris plata',
                'negro': 'negro', 'moreno': 'negro',
                'rojo': 'rojo', 'azul': 'azul',
                'amarón': 'marrón', 'marron': 'marrón', 'marrón': 'marrón',
                'ford': 'ford', 'renault': 'renault', 'volkswagen': 'volkswagen',
                'jeep': 'jeep', 'chevrolet': 'chevrolet',
                'depo': 'depósito', 'depósito': 'depósito',
                'mecanico': 'taller mecánico', 'chapisla': 'taller de chapa y pintura',
                'horario': 'horario', 'lanus': 'lanús', 'lomas de zamora': 'lomas de zamora'
            };
            if (corrections[s]) return corrections[s];
            return s.replace(/\s+/g, ' ').trim();
        }

        // ---------- DOM ----------
        const fileInput = document.getElementById('fileInput');
        const uploadArea = document.getElementById('uploadArea');
        const fileName = document.getElementById('fileName');
        const tableContainer = document.getElementById('tableContainer');
        const tableWrapper = document.getElementById('tableWrapper');
        const filterNote = document.getElementById('filterNote');
        const shownColumnsList = document.getElementById('shownColumnsList');
        const warningMessage = document.getElementById('warningMessage');

        let allData = [];
        let currentHeaders = [];
        let sortConfig = { column: null, direction: 'asc' }; // 'asc' o 'desc'

        uploadArea.addEventListener('click', () => fileInput.click());
        fileInput.addEventListener('change', handleFile);

        uploadArea.addEventListener('dragover', (e) => {
            e.preventDefault();
            uploadArea.style.borderColor = '#3b7cff';
            uploadArea.style.background = '#eaf2ff';
        });
        uploadArea.addEventListener('dragleave', () => {
            uploadArea.style.borderColor = '#b9c8dd';
            uploadArea.style.background = '#fafcff';
        });
        uploadArea.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadArea.style.borderColor = '#b9c8dd';
            uploadArea.style.background = '#fafcff';
            if (e.dataTransfer.files.length) {
                fileInput.files = e.dataTransfer.files;
                handleFile();
            }
        });

        function handleFile() {
            const file = fileInput.files[0];
            if (!file) return;
            if (!file.name.toLowerCase().endsWith('.csv')) {
                alert('Selecciona un archivo .csv');
                fileInput.value = '';
                return;
            }
            fileName.textContent = `📎 ${file.name} (${(file.size / 1024).toFixed(1)} KB)`;
            warningMessage.style.display = 'none';

            Papa.parse(file, {
                header: true,
                skipEmptyLines: true,
                trimHeaders: true,
                dynamicTyping: true,
                complete: function(results) {
                    if (results.errors.length) console.warn('Errores:', results.errors);
                    if (!results.data || results.data.length === 0) {
                        alert('El CSV está vacío o no tiene encabezados.');
                        return;
                    }

                    if (results.data.length > 5000) {
                        warningMessage.style.display = 'block';
                    }

                    const allHeaders = results.meta.fields || Object.keys(results.data[0]);
                    const targetLower = TARGET_COLUMNS.map(c => c.toLowerCase());
                    const filteredHeaders = allHeaders.filter(h => targetLower.includes(h.toLowerCase()));

                    if (filteredHeaders.length === 0) {
                        alert('No se encontraron las columnas esperadas.\nBuscadas: ' + TARGET_COLUMNS.join(', '));
                        return;
                    }

                    const displayList = filteredHeaders.map(h => DISPLAY_NAMES[h] || h).join(', ');
                    shownColumnsList.textContent = displayList;
                    filterNote.style.display = 'block';

                    // Limpiar datos
                    allData = results.data.map(row => {
                        const newRow = {};
                        filteredHeaders.forEach(h => {
                            let val = row[h];
                            if (typeof val === 'string') {
                                val = cleanText(val);
                            }
                            newRow[h] = val;
                        });
                        return newRow;
                    });
                    currentHeaders = filteredHeaders;
                    sortConfig = { column: null, direction: 'asc' };

                    buildTable(allData, currentHeaders);
                    tableContainer.style.display = 'flex';
                },
                error: function(error) {
                    alert('Error al leer el archivo: ' + error.message);
                }
            });
        }

        // ---------- CONSTRUIR TABLA CON BOTÓN ÚNICO ----------
        function buildTable(data, headers) {
            let tableHtml = '<table><thead><tr>';
            headers.forEach(h => {
                const displayName = DISPLAY_NAMES[h] || h;
                tableHtml += `<th>${displayName} 
                    <button class="sort-btn" data-column="${h}" title="Ordenar">↕</button>
                </th>`;
            });
            tableHtml += '</tr></thead><tbody id="tableBody">';
            tableHtml += '</tbody></table>';

            tableWrapper.innerHTML = tableHtml;

            // Asignar evento a cada botón
            const buttons = document.querySelectorAll('.sort-btn');
            buttons.forEach(btn => {
                btn.addEventListener('click', function(e) {
                    const column = this.dataset.column;
                    handleSort(column);
                });
            });

            // Renderizar datos sin orden
            renderRows(data);
        }

        // ---------- MANEJAR ORDEN (alterna asc/desc) ----------
        function handleSort(column) {
            // Determinar nueva dirección
            let newDirection = 'asc';
            if (sortConfig.column === column) {
                // Si ya está ordenado por esta columna, invertir
                newDirection = sortConfig.direction === 'asc' ? 'desc' : 'asc';
            }
            // Si es una columna nueva, empezar con asc
            sortConfig.column = column;
            sortConfig.direction = newDirection;

            // Ordenar datos
            const sorted = [...allData].sort((a, b) => {
                let valA = a[column] ?? '';
                let valB = b[column] ?? '';

                if (typeof valA === 'number' && typeof valB === 'number') {
                    return newDirection === 'asc' ? valA - valB : valB - valA;
                }
                valA = String(valA).toLowerCase();
                valB = String(valB).toLowerCase();
                if (valA < valB) return newDirection === 'asc' ? -1 : 1;
                if (valA > valB) return newDirection === 'asc' ? 1 : -1;
                return 0;
            });

            renderRows(sorted);

            // Actualizar clases de los botones
            document.querySelectorAll('.sort-btn').forEach(b => {
                b.classList.remove('active-asc', 'active-desc');
                const col = b.dataset.column;
                if (col === column) {
                    if (newDirection === 'asc') {
                        b.classList.add('active-asc');
                        b.textContent = '▲';
                    } else {
                        b.classList.add('active-desc');
                        b.textContent = '▼';
                    }
                } else {
                    b.textContent = '↕';
                }
            });
        }

        // ---------- RENDERIZAR FILAS ----------
        function renderRows(data) {
            const tbody = document.getElementById('tableBody');
            if (!tbody) return;

            let html = '';
            if (data.length === 0) {
                html = `<tr><td colspan="${currentHeaders.length}" style="text-align:center; padding:20px; color:#889bb3;">No hay datos</td></tr>`;
            } else {
                data.forEach(row => {
                    html += '<tr>';
                    currentHeaders.forEach(h => {
                        let val = row[h];
                        if (val === null || val === undefined) val = '';
                        let str = String(val);
                        if (str.length > 50) str = str.substring(0, 47) + '…';
                        html += `<td title="${String(val).replace(/"/g, '&quot;')}">${str}</td>`;
                    });
                    html += '</tr>';
                });
            }
            tbody.innerHTML = html;
        }
    })();
</script>
</body>
</html>
