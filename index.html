<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stock</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        html, body {
            height: 100%;
            font-family: 'Segoe UI', sans-serif;
            background: #f4f7fc;
            overflow: hidden;
        }
        .container {
            display: flex;
            flex-direction: column;
            height: 100vh;
            max-width: 100%;
            background: white;
            padding: 10px 15px;
        }
        .header {
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 6px;
        }
        .header h1 {
            font-weight: 300;
            font-size: 1.4rem;
            color: #0b2b44;
            margin: 0;
        }
        .header .subtitle {
            color: #5e6f88;
            font-size: 0.8rem;
        }
        .upload-area {
            border: 2px dashed #b9c8dd;
            border-radius: 8px;
            padding: 6px 14px;
            background: #fafcff;
            cursor: pointer;
            transition: 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            flex-shrink: 0;
        }
        .upload-area:hover {
            border-color: #3b7cff;
            background: #f0f6ff;
        }
        .upload-area input {
            display: none;
        }
        .upload-label {
            font-size: 0.85rem;
            color: #2b4b6f;
        }
        .upload-label strong {
            color: #3b7cff;
            text-decoration: underline;
        }
        .file-name {
            font-weight: 500;
            color: #1d3b5c;
            font-size: 0.8rem;
        }
        .filter-note {
            background: #eef6ff;
            border-left: 4px solid #3b7cff;
            padding: 4px 12px;
            border-radius: 5px;
            font-size: 0.75rem;
            color: #1d3b5c;
            flex-shrink: 0;
            margin: 3px 0;
            display: none;
        }
        .table-wrapper {
            flex: 1 1 auto;
            overflow: auto;
            border-radius: 8px;
            border: 1px solid #e3eaf2;
            background: white;
            min-height: 0;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.8rem;
        }
        thead {
            position: sticky;
            top: 0;
            z-index: 3;
        }
        th {
            background: #e9eff7;
            color: #1f3b57;
            font-weight: 600;
            padding: 4px 8px;
            text-align: left;
            white-space: nowrap;
            border-bottom: 1px solid #d0dbe8;
            vertical-align: middle;
        }
        th select {
            width: 100%;
            padding: 2px 4px;
            font-size: 0.7rem;
            border: 1px solid #d0dbe8;
            border-radius: 4px;
            background: white;
            margin-top: 2px;
            max-width: 120px;
        }
        th select:focus {
            border-color: #3b7cff;
            outline: none;
        }
        .sort-btn {
            background: none;
            border: none;
            cursor: pointer;
            font-size: 0.7rem;
            padding: 0 2px;
            color: #889bb3;
            vertical-align: middle;
        }
        .sort-btn:hover {
            color: #3b7cff;
        }
        .sort-btn.active-asc {
            color: #3b7cff;
            font-weight: bold;
        }
        .sort-btn.active-desc {
            color: #e74c3c;
            font-weight: bold;
        }
        td {
            padding: 4px 8px;
            border-bottom: 1px solid #eef3f9;
            max-width: 160px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        tr:hover td {
            background: #f8fbff;
        }
        .footer {
            flex-shrink: 0;
            text-align: center;
            font-size: 0.65rem;
            color: #889bb3;
            padding-top: 4px;
            border-top: 1px solid #e9edf4;
            margin-top: 4px;
        }
        #tableContainer {
            display: none;
            flex: 1 1 auto;
            min-height: 0;
            flex-direction: column;
        }
        #filterNote {
            display: none;
        }
        .warning {
            background: #fff3cd;
            border: 1px solid #ffc107;
            color: #856404;
            padding: 3px 10px;
            border-radius: 4px;
            font-size: 0.7rem;
            flex-shrink: 0;
            margin: 2px 0;
            display: none;
        }
        .restore-btn {
            background: none;
            border: 1px solid #d0dbe8;
            border-radius: 4px;
            padding: 2px 10px;
            font-size: 0.7rem;
            cursor: pointer;
            color: #3b7cff;
            flex-shrink: 0;
            margin-left: 6px;
        }
        .restore-btn:hover {
            background: #e9eff7;
        }
        @media (max-width: 600px) {
            .container { padding: 5px 8px; }
            .header h1 { font-size: 1.1rem; }
            td { font-size: 0.65rem; padding: 3px 5px; }
            th { font-size: 0.7rem; padding: 3px 5px; }
            th select { font-size: 0.6rem; max-width: 80px; }
        }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <div>
            <h1>📊 Visualizador CSV</h1>
            <span class="subtitle">Filtros desplegables con agrupación inteligente</span>
        </div>
        <div style="display:flex; align-items:center; gap:6px; flex-wrap:wrap;">
            <div class="upload-area" id="uploadArea">
                <div class="upload-label">📂 <strong>Selecciona</strong> o arrastra CSV</div>
                <input type="file" id="fileInput" accept=".csv">
                <span class="file-name" id="fileName"></span>
            </div>
            <button class="restore-btn" id="restoreFilters" style="display:none;">✕ Limpiar filtros</button>
        </div>
    </div>

    <div id="filterNote" class="filter-note">
        ⚡ Columnas: <strong id="shownColumnsList"></strong>
    </div>
    <div id="warningMessage" class="warning">⚠️ Más de 5000 filas – puede ser lento.</div>

    <div id="tableContainer">
        <div class="table-wrapper" id="tableWrapper">
            <!-- Tabla se genera con JS -->
        </div>
    </div>

    <div class="footer">Hecho por Juano</div>
</div>

<script>
    (function() {
        // ========== COLUMNAS Y NOMBRES ==========
        const TARGET_COLUMNS = [
            'stock_brand', 'stock_model_version', 'stock_version', 'stock_domain',
            'stock_used_year', 'stock_color', 'stock_vehicle_kms', 'stock_location'
        ];

        const DISPLAY_NAMES = {
            'stock_brand': 'Marca',
            'stock_model_version': 'Modelo',
            'stock_version': 'Versión',
            'stock_domain': 'Patente',
            'stock_used_year': 'Año',
            'stock_color': 'Color',
            'stock_vehicle_kms': 'kms',
            'stock_location': 'Ubicación'
        };

        // ========== NORMALIZACIÓN AVANZADA PARA AGRUPAR ==========
        function normalizeGroup(text) {
            if (!text) return '';
            let s = String(text).trim().toLowerCase();

            // 1. Eliminar contenido entre paréntesis y la palabra "usado"
            s = s.replace(/\([^)]*\)/g, '').replace(/\busado\b/g, '').replace(/\bhyundai\b/g, '');
            // 2. Eliminar espacios extra
            s = s.replace(/\s+/g, ' ').trim();

            // 3. Mapeo de sinónimos (agrupar)
            const synonyms = {
                'vw': 'volkswagen',
                'volkswagen': 'volkswagen',
                'ford': 'ford',
                'toyota': 'toyota',
                'chevrolet': 'chevrolet',
                'chevy': 'chevrolet',
                'renault': 'renault',
                'peugeot': 'peugeot',
                'citroen': 'citroen',
                'fiat': 'fiat',
                'jeep': 'jeep',
                'nissan': 'nissan',
                'hyundai': 'hyundai',
                'triumph': 'triumph',
                'dodge': 'dodge',
                'cherry': 'cherry',
                'kangoo': 'renault'  // Kangoo es modelo de Renault, pero lo dejamos como renault si quieres
            };

            // Si el texto coincide con alguna clave, devolvemos el valor mapeado
            if (synonyms[s]) return synonyms[s];

            // Si el texto contiene alguna palabra clave, lo agrupamos (ej: "ford usado" → "ford")
            for (let key in synonyms) {
                if (s.includes(key)) {
                    return synonyms[key];
                }
            }

            return s;
        }

        // ========== LIMPIEZA BÁSICA (para mostrar) ==========
        function cleanText(str) {
            if (!str) return '';
            let s = String(str).trim().toLowerCase();
            // Correcciones menores (ortográficas)
            const corrections = {
                'biarco': 'blanco', 'blanca': 'blanco',
                'gris plata': 'gris plata', 'plateado': 'gris plata',
                'moreno': 'negro',
                'amarón': 'marrón', 'marron': 'marrón'
            };
            if (corrections[s]) return corrections[s];
            return s.replace(/\s+/g, ' ').trim();
        }

        // ========== DOM ==========
        const fileInput = document.getElementById('fileInput');
        const uploadArea = document.getElementById('uploadArea');
        const fileName = document.getElementById('fileName');
        const tableContainer = document.getElementById('tableContainer');
        const tableWrapper = document.getElementById('tableWrapper');
        const filterNote = document.getElementById('filterNote');
        const shownColumnsList = document.getElementById('shownColumnsList');
        const warningMessage = document.getElementById('warningMessage');
        const restoreFiltersBtn = document.getElementById('restoreFilters');

        let allData = [];
        let currentHeaders = [];
        let visibleHeaders = [];
        let sortConfig = { column: null, direction: 'asc' };
        // Filtros activos: { columna: valorSeleccionado }
        let activeFilters = {};

        // Almacenar valores únicos normalizados por columna
        let uniqueValues = {};

        uploadArea.addEventListener('click', () => fileInput.click());
        fileInput.addEventListener('change', handleFile);

        uploadArea.addEventListener('dragover', (e) => {
            e.preventDefault();
            uploadArea.style.borderColor = '#3b7cff';
            uploadArea.style.background = '#eaf2ff';
        });
        uploadArea.addEventListener('dragleave', () => {
            uploadArea.style.borderColor = '#b9c8dd';
            uploadArea.style.background = '#fafcff';
        });
        uploadArea.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadArea.style.borderColor = '#b9c8dd';
            uploadArea.style.background = '#fafcff';
            if (e.dataTransfer.files.length) {
                fileInput.files = e.dataTransfer.files;
                handleFile();
            }
        });

        restoreFiltersBtn.addEventListener('click', function() {
            // Resetear todos los selects a "Todos"
            document.querySelectorAll('.filter-select').forEach(sel => sel.value = '');
            activeFilters = {};
            applyFiltersAndRender();
            this.style.display = 'none';
        });

        function handleFile() {
            const file = fileInput.files[0];
            if (!file) return;
            if (!file.name.toLowerCase().endsWith('.csv')) {
                alert('Selecciona un archivo .csv');
                fileInput.value = '';
                return;
            }
            fileName.textContent = `📎 ${file.name} (${(file.size / 1024).toFixed(1)} KB)`;
            warningMessage.style.display = 'none';

            Papa.parse(file, {
                header: true,
                skipEmptyLines: true,
                trimHeaders: true,
                dynamicTyping: true,
                complete: function(results) {
                    if (results.errors.length) console.warn('Errores:', results.errors);
                    if (!results.data || results.data.length === 0) {
                        alert('El CSV está vacío o no tiene encabezados.');
                        return;
                    }

                    if (results.data.length > 5000) {
                        warningMessage.style.display = 'block';
                    }

                    const allHeaders = results.meta.fields || Object.keys(results.data[0]);
                    const targetLower = TARGET_COLUMNS.map(c => c.toLowerCase());
                    const filteredHeaders = allHeaders.filter(h => targetLower.includes(h.toLowerCase()));

                    if (filteredHeaders.length === 0) {
                        alert('No se encontraron las columnas esperadas.\nBuscadas: ' + TARGET_COLUMNS.join(', '));
                        return;
                    }

                    const displayList = filteredHeaders.map(h => DISPLAY_NAMES[h] || h).join(', ');
                    shownColumnsList.textContent = displayList;
                    filterNote.style.display = 'block';

                    // Procesar datos: limpiar y normalizar para agrupación
                    allData = results.data.map(row => {
                        const newRow = {};
                        filteredHeaders.forEach(h => {
                            let val = row[h];
                            if (typeof val === 'string') {
                                // Guardamos el valor limpio para mostrar
                                val = cleanText(val);
                            }
                            newRow[h] = val;
                        });
                        return newRow;
                    });

                    currentHeaders = filteredHeaders;
                    visibleHeaders = [...currentHeaders];
                    sortConfig = { column: null, direction: 'asc' };
                    activeFilters = {};

                    // Calcular valores únicos normalizados por columna
                    uniqueValues = {};
                    currentHeaders.forEach(h => {
                        const rawValues = allData.map(row => row[h]).filter(v => v !== null && v !== undefined && v !== '');
                        const normalizedSet = new Set();
                        rawValues.forEach(v => {
                            const norm = normalizeGroup(String(v));
                            if (norm) normalizedSet.add(norm);
                        });
                        // Ordenar alfabéticamente
                        uniqueValues[h] = Array.from(normalizedSet).sort();
                    });

                    buildTable(allData, visibleHeaders);
                    tableContainer.style.display = 'flex';
                    restoreFiltersBtn.style.display = 'inline-block';
                },
                error: function(error) {
                    alert('Error al leer el archivo: ' + error.message);
                }
            });
        }

        // ========== CONSTRUIR TABLA CON FILTROS ==========
        function buildTable(data, visibleCols) {
            let tableHtml = '<table><thead><tr>';
            visibleCols.forEach(h => {
                const displayName = DISPLAY_NAMES[h] || h;
                tableHtml += `
                    <th>
                        <div style="display:flex; flex-direction:column; gap:2px;">
                            <div>
                                ${displayName}
                                <button class="sort-btn" data-column="${h}" data-direction="asc">▲</button>
                                <button class="sort-btn" data-column="${h}" data-direction="desc">▼</button>
                            </div>
                            <select class="filter-select" data-column="${h}">
                                <option value="">Todos</option>
                                ${(uniqueValues[h] || []).map(val => `<option value="${val}">${val}</option>`).join('')}
                            </select>
                        </div>
                    </th>
                `;
            });
            tableHtml += '</tr></thead><tbody id="tableBody">';
            tableHtml += '</tbody></table>';

            tableWrapper.innerHTML = tableHtml;

            // Eventos de orden
            document.querySelectorAll('.sort-btn').forEach(btn => {
                btn.addEventListener('click', function(e) {
                    const col = this.dataset.column;
                    const dir = this.dataset.direction;
                    handleSort(col, dir);
                });
            });

            // Eventos de filtro
            document.querySelectorAll('.filter-select').forEach(sel => {
                sel.addEventListener('change', function(e) {
                    const col = this.dataset.column;
                    const val = this.value;
                    if (val === '') {
                        delete activeFilters[col];
                    } else {
                        activeFilters[col] = val;
                    }
                    // Mostrar/ocultar botón limpiar
                    const hasFilter = Object.keys(activeFilters).length > 0;
                    restoreFiltersBtn.style.display = hasFilter ? 'inline-block' : 'none';
                    applyFiltersAndRender();
                });
            });

            // Cargar filtros activos si existen (al restaurar)
            document.querySelectorAll('.filter-select').forEach(sel => {
                const col = sel.dataset.column;
                if (activeFilters[col]) {
                    sel.value = activeFilters[col];
                }
            });

            // Aplicar filtros y renderizar
            applyFiltersAndRender();
        }

        // ========== APLICAR FILTROS Y RENDERIZAR ==========
        function applyFiltersAndRender() {
            // 1. Filtrar datos según activeFilters
            let filtered = allData.filter(row => {
                for (let col in activeFilters) {
                    const filterVal = activeFilters[col];
                    if (!filterVal) continue;
                    const raw = row[col];
                    if (raw === null || raw === undefined) return false;
                    // Normalizar el valor de la fila para comparar con el filtro
                    const norm = normalizeGroup(String(raw));
                    if (norm !== filterVal) return false;
                }
                return true;
            });

            // 2. Aplicar orden si existe
            if (sortConfig.column) {
                const col = sortConfig.column;
                const dir = sortConfig.direction;
                filtered = [...filtered].sort((a, b) => {
                    let valA = a[col] ?? '';
                    let valB = b[col] ?? '';
                    if (typeof valA === 'number' && typeof valB === 'number') {
                        return dir === 'asc' ? valA - valB : valB - valA;
                    }
                    valA = String(valA).toLowerCase();
                    valB = String(valB).toLowerCase();
                    if (valA < valB) return dir === 'asc' ? -1 : 1;
                    if (valA > valB) return dir === 'asc' ? 1 : -1;
                    return 0;
                });
            }

            renderRows(filtered);
        }

        // ========== MANEJAR ORDEN ==========
        function handleSort(column, direction) {
            sortConfig.column = column;
            sortConfig.direction = direction;
            // Marcar botones activos
            document.querySelectorAll('.sort-btn').forEach(b => {
                b.classList.remove('active-asc', 'active-desc');
                if (b.dataset.column === column) {
                    if (direction === 'asc') b.classList.add('active-asc');
                    else b.classList.add('active-desc');
                }
            });
            applyFiltersAndRender();
        }

        // ========== RENDERIZAR FILAS ==========
        function renderRows(data) {
            const tbody = document.getElementById('tableBody');
            if (!tbody) return;

            let html = '';
            if (data.length === 0) {
                html = `<tr><td colspan="${visibleHeaders.length}" style="text-align:center; padding:15px; color:#889bb3;">No hay datos que coincidan con los filtros</td></tr>`;
            } else {
                data.forEach(row => {
                    html += '<tr>';
                    visibleHeaders.forEach(h => {
                        let val = row[h];
                        if (val === null || val === undefined) val = '';
                        let str = String(val);
                        if (str.length > 50) str = str.substring(0, 47) + '…';
                        html += `<td title="${String(val).replace(/"/g, '&quot;')}">${str}</td>`;
                    });
                    html += '</tr>';
                });
            }
            tbody.innerHTML = html;
        }

        // Exponer applyFiltersAndRender por si se necesita
        window.applyFiltersAndRender = applyFiltersAndRender;
    })();
</script>
</body>
</html>
