<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visualizador CSV - Búsqueda y Orden</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body { height: 100%; font-family: 'Segoe UI', sans-serif; background: #f4f7fc; overflow: hidden; }
        .container { display: flex; flex-direction: column; height: 100vh; max-width: 100%; background: white; padding: 15px 20px; }
        .header { flex-shrink: 0; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 10px; margin-bottom: 8px; }
        .header h1 { font-weight: 300; font-size: 1.5rem; color: #0b2b44; margin: 0; }
        .header .subtitle { color: #5e6f88; font-size: 0.85rem; }
        .upload-area { border: 2px dashed #b9c8dd; border-radius: 10px; padding: 8px 18px; background: #fafcff; cursor: pointer; transition: 0.2s; display: inline-flex; align-items: center; gap: 10px; flex-shrink: 0; }
        .upload-area:hover { border-color: #3b7cff; background: #f0f6ff; }
        .upload-area input { display: none; }
        .upload-label { font-size: 0.9rem; color: #2b4b6f; }
        .upload-label strong { color: #3b7cff; text-decoration: underline; }
        .file-name { font-weight: 500; color: #1d3b5c; font-size: 0.85rem; }
        .filter-note { background: #eef6ff; border-left: 4px solid #3b7cff; padding: 5px 14px; border-radius: 6px; font-size: 0.8rem; color: #1d3b5c; flex-shrink: 0; margin: 4px 0; display: none; }
        .table-wrapper { flex: 1 1 auto; overflow: auto; border-radius: 10px; border: 1px solid #e3eaf2; background: white; min-height: 0; position: relative; }
        table { width: 100%; border-collapse: collapse; font-size: 0.82rem; }
        thead { position: sticky; top: 0; z-index: 3; }
        th { background: #e9eff7; color: #1f3b57; font-weight: 600; padding: 6px 10px; text-align: left; white-space: nowrap; border-bottom: 1px solid #d0dbe8; }
        .sort-btn { background: none; border: none; cursor: pointer; font-size: 0.8rem; padding: 0 4px; margin-left: 6px; color: #889bb3; transition: 0.15s; vertical-align: middle; }
        .sort-btn:hover { color: #3b7cff; }
        .sort-btn.active-asc { color: #3b7cff; font-weight: bold; }
        .sort-btn.active-desc { color: #e74c3c; font-weight: bold; }
        td { padding: 6px 10px; border-bottom: 1px solid #eef3f9; max-width: 180px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        tr:hover td { background: #f8fbff; }
        .footer { flex-shrink: 0; text-align: center; font-size: 0.7rem; color: #889bb3; padding-top: 6px; border-top: 1px solid #e9edf4; margin-top: 6px; }
        #tableContainer { display: none; flex: 1 1 auto; min-height: 0; flex-direction: column; }
        #filterNote { display: none; }
        .warning { background: #fff3cd; border: 1px solid #ffc107; color: #856404; padding: 4px 12px; border-radius: 6px; font-size: 0.75rem; flex-shrink: 0; margin: 3px 0; display: none; }
        .search-box { flex-shrink: 0; margin: 6px 0; display: flex; gap: 8px; align-items: center; }
        .search-box input { flex: 1; padding: 6px 12px; border: 1px solid #d0dbe8; border-radius: 6px; font-size: 0.85rem; max-width: 300px; }
        .search-box input:focus { outline: none; border-color: #3b7cff; box-shadow: 0 0 0 2px rgba(59,124,255,0.15); }
        .clear-search { background: none; border: none; color: #3b7cff; cursor: pointer; font-size: 0.8rem; padding: 0 8px; }
        .clear-search:hover { text-decoration: underline; }
        .counter { font-size: 0.8rem; color: #5e6f88; margin-left: 8px; }
        @media (max-width: 600px) {
            .container { padding: 8px 10px; }
            .header h1 { font-size: 1.1rem; }
            td { font-size: 0.7rem; padding: 4px 6px; }
            th { font-size: 0.75rem; padding: 4px 6px; }
            .search-box input { max-width: 150px; font-size: 0.75rem; }
        }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <div>
            <h1>📊 Visualizador CSV</h1>
            <span class="subtitle">Buscar en todas las columnas y ordenar con un clic</span>
        </div>
        <div class="upload-area" id="uploadArea">
            <div class="upload-label">📂 <strong>Selecciona</strong> o arrastra CSV</div>
            <input type="file" id="fileInput" accept=".csv">
            <span class="file-name" id="fileName"></span>
        </div>
    </div>

    <div id="filterNote" class="filter-note">
        ⚡ Columnas: <strong id="shownColumnsList"></strong>
    </div>
    <div id="warningMessage" class="warning">⚠️ Más de 5000 filas – el rendimiento puede verse afectado.</div>

    <!-- Búsqueda global -->
    <div class="search-box" id="searchBox" style="display:none;">
        <input type="text" id="searchInput" placeholder="🔍 Buscar en todas las columnas...">
        <span class="counter" id="rowCounter"></span>
        <button class="clear-search" id="clearSearch">✕</button>
    </div>

    <div id="tableContainer">
        <div class="table-wrapper" id="tableWrapper">
            <!-- Tabla generada con JS -->
        </div>
    </div>

    <div class="footer">Hecho con ❤️ – búsqueda global y orden por columna</div>
</div>

<script>
    (function() {
        // Columnas y nombres
        const TARGET_COLUMNS = [
            'stock_brand', 'stock_model_version', 'stock_version', 'stock_domain',
            'stock_used_year', 'stock_color', 'stock_vehicle_kms', 'stock_location'
        ];
        const DISPLAY_NAMES = {
            'stock_brand': 'Marca',
            'stock_model_version': 'Modelo',
            'stock_version': 'Versión',
            'stock_domain': 'Patente',
            'stock_used_year': 'Año',
            'stock_color': 'Color',
            'stock_vehicle_kms': 'kms',
            'stock_location': 'Ubicación'
        };

        // Limpieza
        function cleanText(str) {
            if (!str) return '';
            let s = String(str).trim().toLowerCase();
            const corrections = {
                'biarco': 'blanco', 'blanca': 'blanco', 'blanco': 'blanco',
                'gris': 'gris', 'gris plata': 'gris plata', 'plateado': 'gris plata',
                'negro': 'negro', 'moreno': 'negro',
                'rojo': 'rojo', 'azul': 'azul',
                'amarón': 'marrón', 'marron': 'marrón', 'marrón': 'marrón',
                'ford': 'ford', 'renault': 'renault', 'volkswagen': 'volkswagen',
                'jeep': 'jeep', 'chevrolet': 'chevrolet',
                'depo': 'depósito', 'depósito': 'depósito',
                'mecanico': 'taller mecánico', 'chapisla': 'taller de chapa y pintura',
                'horario': 'horario', 'lanus': 'lanús', 'lomas de zamora': 'lomas de zamora'
            };
            if (corrections[s]) return corrections[s];
            return s.replace(/\s+/g, ' ').trim();
        }

        // DOM
        const fileInput = document.getElementById('fileInput');
        const uploadArea = document.getElementById('uploadArea');
        const fileName = document.getElementById('fileName');
        const tableContainer = document.getElementById('tableContainer');
        const tableWrapper = document.getElementById('tableWrapper');
        const filterNote = document.getElementById('filterNote');
        const shownColumnsList = document.getElementById('shownColumnsList');
        const warningMessage = document.getElementById('warningMessage');
        const searchInput = document.getElementById('searchInput');
        const searchBox = document.getElementById('searchBox');
        const rowCounter = document.getElementById('rowCounter');
        const clearSearch = document.getElementById('clearSearch');

        let allData = [];
        let currentHeaders = [];
        let sortConfig = { column: null, direction: 'asc' };
        let searchTerm = '';

        uploadArea.addEventListener('click', () => fileInput.click());
        fileInput.addEventListener('change', handleFile);

        uploadArea.addEventListener('dragover', (e) => {
            e.preventDefault();
            uploadArea.style.borderColor = '#3b7cff';
            uploadArea.style.background = '#eaf2ff';
        });
        uploadArea.addEventListener('dragleave', () => {
            uploadArea.style.borderColor = '#b9c8dd';
            uploadArea.style.background = '#fafcff';
        });
        uploadArea.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadArea.style.borderColor = '#b9c8dd';
            uploadArea.style.background = '#fafcff';
            if (e.dataTransfer.files.length) {
                fileInput.files = e.dataTransfer.files;
                handleFile();
            }
        });

        // Eventos de búsqueda
        searchInput.addEventListener('input', function() {
            searchTerm = this.value.trim().toLowerCase();
            applyFiltersAndSort();
        });

        clearSearch.addEventListener('click', function() {
            searchInput.value = '';
            searchTerm = '';
            applyFiltersAndSort();
        });

        function handleFile() {
            const file = fileInput.files[0];
            if (!file) return;
            if (!file.name.toLowerCase().endsWith('.csv')) {
                alert('Selecciona un archivo .csv');
                fileInput.value = '';
                return;
            }
            fileName.textContent = `📎 ${file.name} (${(file.size / 1024).toFixed(1)} KB)`;
            warningMessage.style.display = 'none';

            Papa.parse(file, {
                header: true,
                skipEmptyLines: true,
                trimHeaders: true,
                dynamicTyping: true,
                complete: function(results) {
                    if (results.errors.length) console.warn('Errores:', results.errors);
                    if (!results.data || results.data.length === 0) {
                        alert('El CSV está vacío o no tiene encabezados.');
                        return;
                    }

                    if (results.data.length > 5000) {
                        warningMessage.style.display = 'block';
                    }

                    const allHeaders = results.meta.fields || Object.keys(results.data[0]);
                    const targetLower = TARGET_COLUMNS.map(c => c.toLowerCase());
                    const filteredHeaders = allHeaders.filter(h => targetLower.includes(h.toLowerCase()));

                    if (filteredHeaders.length === 0) {
                        alert('No se encontraron las columnas esperadas.\nBuscadas: ' + TARGET_COLUMNS.join(', '));
                        return;
                    }

                    const displayList = filteredHeaders.map(h => DISPLAY_NAMES[h] || h).join(', ');
                    shownColumnsList.textContent = displayList;
                    filterNote.style.display = 'block';

                    allData = results.data.map(row => {
                        const newRow = {};
                        filteredHeaders.forEach(h => {
                            let val = row[h];
                            if (typeof val === 'string') {
                                val = cleanText(val);
                            }
                            newRow[h] = val;
                        });
                        return newRow;
                    });
                    currentHeaders = filteredHeaders;
                    sortConfig = { column: null, direction: 'asc' };
                    searchTerm = '';
                    searchInput.value = '';
                    searchBox.style.display = 'flex';

                    buildTable(allData, currentHeaders);
                    tableContainer.style.display = 'flex';
                },
                error: function(error) {
                    alert('Error al leer el archivo: ' + error.message);
                }
            });
        }

        function buildTable(data, headers) {
            let tableHtml = '<table><thead><tr>';
            headers.forEach(h => {
                const displayName = DISPLAY_NAMES[h] || h;
                tableHtml += `<th>${displayName} 
                    <button class="sort-btn" data-column="${h}">↕</button>
                </th>`;
            });
            tableHtml += '</tr></thead><tbody id="tableBody">';
            tableHtml += '</tbody></table>';

            tableWrapper.innerHTML = tableHtml;

            // Eventos de orden
            document.querySelectorAll('.sort-btn').forEach(btn => {
                btn.addEventListener('click', function() {
                    const col = this.dataset.column;
                    toggleSort(col);
                });
            });

            applyFiltersAndSort();
        }

        function toggleSort(column) {
            if (sortConfig.column === column) {
                sortConfig.direction = sortConfig.direction === 'asc' ? 'desc' : 'asc';
            } else {
                sortConfig.column = column;
                sortConfig.direction = 'asc';
            }
            applyFiltersAndSort();
        }

        function applyFiltersAndSort() {
            // Filtrar
            let filtered = allData;
            if (searchTerm) {
                filtered = allData.filter(row => {
                    for (let h of currentHeaders) {
                        let val = row[h];
                        if (val !== null && val !== undefined) {
                            if (String(val).toLowerCase().includes(searchTerm)) {
                                return true;
                            }
                        }
                    }
                    return false;
                });
            }

            // Ordenar
            if (sortConfig.column) {
                const col = sortConfig.column;
                const dir = sortConfig.direction;
                filtered = [...filtered].sort((a, b) => {
                    let valA = a[col] ?? '';
                    let valB = b[col] ?? '';
                    if (typeof valA === 'number' && typeof valB === 'number') {
                        return dir === 'asc' ? valA - valB : valB - valA;
                    }
                    valA = String(valA).toLowerCase();
                    valB = String(valB).toLowerCase();
                    if (valA < valB) return dir === 'asc' ? -1 : 1;
                    if (valA > valB) return dir === 'asc' ? 1 : -1;
                    return 0;
                });
            }

            // Actualizar contador
            rowCounter.textContent = `${filtered.length} filas${allData.length !== filtered.length ? ` (de ${allData.length})` : ''}`;

            // Renderizar
            renderRows(filtered);

            // Actualizar botones de orden
            document.querySelectorAll('.sort-btn').forEach(btn => {
                btn.classList.remove('active-asc', 'active-desc');
                const col = btn.dataset.column;
                if (col === sortConfig.column) {
                    if (sortConfig.direction === 'asc') {
                        btn.classList.add('active-asc');
                        btn.textContent = '▲';
                    } else {
                        btn.classList.add('active-desc');
                        btn.textContent = '▼';
                    }
                } else {
                    btn.textContent = '↕';
                }
            });
        }

        function renderRows(data) {
            const tbody = document.getElementById('tableBody');
            if (!tbody) return;

            let html = '';
            if (data.length === 0) {
                html = `<tr><td colspan="${currentHeaders.length}" style="text-align:center; padding:20px; color:#889bb3;">No se encontraron resultados</td></tr>`;
            } else {
                data.forEach(row => {
                    html += '<tr>';
                    currentHeaders.forEach(h => {
                        let val = row[h];
                        if (val === null || val === undefined) val = '';
                        let str = String(val);
                        if (str.length > 50) str = str.substring(0, 47) + '…';
                        html += `<td title="${String(val).replace(/"/g, '&quot;')}">${str}</td>`;
                    });
                    html += '</tr>';
                });
            }
            tbody.innerHTML = html;
        }
    })();
</script>
</body>
</html>
