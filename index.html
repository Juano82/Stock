<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visualizador CSV - Filtros por columna</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        html, body {
            height: 100%;
            font-family: 'Segoe UI', sans-serif;
            background: #f4f7fc;
            overflow: hidden;
        }
        .container {
            display: flex;
            flex-direction: column;
            height: 100vh;
            max-width: 100%;
            background: white;
            padding: 15px 20px;
        }
        .header {
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 8px;
        }
        .header h1 {
            font-weight: 300;
            font-size: 1.5rem;
            color: #0b2b44;
            margin: 0;
        }
        .header .subtitle {
            color: #5e6f88;
            font-size: 0.85rem;
        }
        .upload-area {
            border: 2px dashed #b9c8dd;
            border-radius: 10px;
            padding: 8px 18px;
            background: #fafcff;
            cursor: pointer;
            transition: 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            flex-shrink: 0;
        }
        .upload-area:hover {
            border-color: #3b7cff;
            background: #f0f6ff;
        }
        .upload-area input {
            display: none;
        }
        .upload-label {
            font-size: 0.9rem;
            color: #2b4b6f;
        }
        .upload-label strong {
            color: #3b7cff;
            text-decoration: underline;
        }
        .file-name {
            font-weight: 500;
            color: #1d3b5c;
            font-size: 0.85rem;
        }
        .filter-note {
            background: #eef6ff;
            border-left: 4px solid #3b7cff;
            padding: 5px 14px;
            border-radius: 6px;
            font-size: 0.8rem;
            color: #1d3b5c;
            flex-shrink: 0;
            margin: 4px 0;
            display: none;
        }
        /* Fila de filtros (selectores) */
        .filters-row {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            background: #f8faff;
            padding: 8px 12px;
            border-radius: 8px;
            border: 1px solid #e3eaf2;
            flex-shrink: 0;
            margin-bottom: 8px;
            align-items: center;
        }
        .filters-row select {
            padding: 4px 8px;
            border: 1px solid #d0dbe8;
            border-radius: 4px;
            font-size: 0.78rem;
            background: white;
            min-width: 80px;
            max-width: 150px;
        }
        .filters-row label {
            font-size: 0.75rem;
            color: #4c6a8a;
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .filters-row .clear-filters-btn {
            background: none;
            border: 1px solid #d0dbe8;
            border-radius: 4px;
            padding: 2px 10px;
            font-size: 0.7rem;
            cursor: pointer;
            color: #3b7cff;
            margin-left: 4px;
        }
        .filters-row .clear-filters-btn:hover {
            background: #e9eff7;
        }
        .table-wrapper {
            flex: 1 1 auto;
            overflow: auto;
            border-radius: 10px;
            border: 1px solid #e3eaf2;
            background: white;
            min-height: 0;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.82rem;
        }
        thead {
            position: sticky;
            top: 0;
            z-index: 3;
        }
        th {
            background: #e9eff7;
            color: #1f3b57;
            font-weight: 600;
            padding: 6px 10px;
            text-align: left;
            white-space: nowrap;
            border-bottom: 1px solid #d0dbe8;
            cursor: pointer;
            user-select: none;
        }
        th:hover {
            background: #dde6f2;
        }
        th .sort-icon {
            margin-left: 4px;
            font-size: 0.7rem;
            color: #889bb3;
        }
        td {
            padding: 6px 10px;
            border-bottom: 1px solid #eef3f9;
            max-width: 180px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        tr:hover td {
            background: #f8fbff;
        }
        .footer {
            flex-shrink: 0;
            text-align: center;
            font-size: 0.7rem;
            color: #889bb3;
            padding-top: 6px;
            border-top: 1px solid #e9edf4;
            margin-top: 6px;
        }
        #tableContainer {
            display: none;
            flex: 1 1 auto;
            min-height: 0;
            flex-direction: column;
        }
        #filterNote {
            display: none;
        }
        .warning {
            background: #fff3cd;
            border: 1px solid #ffc107;
            color: #856404;
            padding: 4px 12px;
            border-radius: 6px;
            font-size: 0.75rem;
            flex-shrink: 0;
            margin: 3px 0;
            display: none;
        }
        @media (max-width: 600px) {
            .container { padding: 8px 10px; }
            .header h1 { font-size: 1.1rem; }
            td { font-size: 0.7rem; padding: 4px 6px; }
            th { font-size: 0.75rem; padding: 4px 6px; }
            .filters-row select { font-size: 0.7rem; padding: 2px 4px; min-width: 60px; }
            .filters-row label { font-size: 0.65rem; }
        }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <div>
            <h1>📊 Visualizador CSV</h1>
            <span class="subtitle">Filtra seleccionando valores en cada columna</span>
        </div>
        <div style="display:flex; align-items:center; gap:8px; flex-wrap:wrap;">
            <div class="upload-area" id="uploadArea">
                <div class="upload-label">📂 <strong>Selecciona</strong> o arrastra CSV</div>
                <input type="file" id="fileInput" accept=".csv">
                <span class="file-name" id="fileName"></span>
            </div>
        </div>
    </div>

    <div id="filterNote" class="filter-note">
        ⚡ Columnas: <strong id="shownColumnsList"></strong>
    </div>
    <div id="warningMessage" class="warning">⚠️ Más de 5000 filas – el rendimiento puede verse afectado.</div>

    <div id="tableContainer">
        <!-- Fila de filtros (selectores) -->
        <div id="filtersRow" class="filters-row"></div>
        <div class="table-wrapper" id="tableWrapper">
            <!-- Tabla generada con JS -->
        </div>
    </div>

    <div class="footer">Hecho con ❤️ – filtros por columna + orden al hacer clic en el encabezado</div>
</div>

<script>
    (function() {
        // ---------- COLUMNAS Y NOMBRES ----------
        const TARGET_COLUMNS = [
            'stock_brand', 'stock_model_version', 'stock_version', 'stock_domain',
            'stock_used_year', 'stock_color', 'stock_vehicle_kms', 'stock_location'
        ];

        const DISPLAY_NAMES = {
            'stock_brand': 'Marca',
            'stock_model_version': 'Modelo',
            'stock_version': 'Versión',
            'stock_domain': 'Patente',
            'stock_used_year': 'Año',
            'stock_color': 'Color',
            'stock_vehicle_kms': 'kms',
            'stock_location': 'Ubicación'
        };

        // ---------- LIMPIEZA ----------
        function cleanText(str) {
            if (!str) return '';
            let s = String(str).trim().toLowerCase();
            const corrections = {
                'biarco': 'blanco', 'blanca': 'blanco', 'blanco': 'blanco',
                'gris': 'gris', 'gris plata': 'gris plata', 'plateado': 'gris plata',
                'negro': 'negro', 'moreno': 'negro',
                'rojo': 'rojo', 'azul': 'azul',
                'amarón': 'marrón', 'marron': 'marrón', 'marrón': 'marrón',
                'ford': 'ford', 'renault': 'renault', 'volkswagen': 'volkswagen',
                'jeep': 'jeep', 'chevrolet': 'chevrolet',
                'depo': 'depósito', 'depósito': 'depósito',
                'mecanico': 'taller mecánico', 'chapisla': 'taller de chapa y pintura',
                'horario': 'horario', 'lanus': 'lanús', 'lomas de zamora': 'lomas de zamora'
            };
            if (corrections[s]) return corrections[s];
            return s.replace(/\s+/g, ' ').trim();
        }

        // ---------- DOM ----------
        const fileInput = document.getElementById('fileInput');
        const uploadArea = document.getElementById('uploadArea');
        const fileName = document.getElementById('fileName');
        const tableContainer = document.getElementById('tableContainer');
        const tableWrapper = document.getElementById('tableWrapper');
        const filterNote = document.getElementById('filterNote');
        const shownColumnsList = document.getElementById('shownColumnsList');
        const warningMessage = document.getElementById('warningMessage');
        const filtersRow = document.getElementById('filtersRow');

        let allData = [];
        let currentHeaders = [];
        let visibleHeaders = [];
        let sortConfig = { column: null, direction: 'asc' };
        let filterValues = {};  // clave: nombre columna, valor: string seleccionado ('' = todos)

        uploadArea.addEventListener('click', () => fileInput.click());
        fileInput.addEventListener('change', handleFile);

        uploadArea.addEventListener('dragover', (e) => {
            e.preventDefault();
            uploadArea.style.borderColor = '#3b7cff';
            uploadArea.style.background = '#eaf2ff';
        });
        uploadArea.addEventListener('dragleave', () => {
            uploadArea.style.borderColor = '#b9c8dd';
            uploadArea.style.background = '#fafcff';
        });
        uploadArea.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadArea.style.borderColor = '#b9c8dd';
            uploadArea.style.background = '#fafcff';
            if (e.dataTransfer.files.length) {
                fileInput.files = e.dataTransfer.files;
                handleFile();
            }
        });

        function handleFile() {
            const file = fileInput.files[0];
            if (!file) return;
            if (!file.name.toLowerCase().endsWith('.csv')) {
                alert('Selecciona un archivo .csv');
                fileInput.value = '';
                return;
            }
            fileName.textContent = `📎 ${file.name} (${(file.size / 1024).toFixed(1)} KB)`;
            warningMessage.style.display = 'none';

            Papa.parse(file, {
                header: true,
                skipEmptyLines: true,
                trimHeaders: true,
                dynamicTyping: true,
                complete: function(results) {
                    if (results.errors.length) console.warn('Errores:', results.errors);
                    if (!results.data || results.data.length === 0) {
                        alert('El CSV está vacío o no tiene encabezados.');
                        return;
                    }

                    if (results.data.length > 5000) {
                        warningMessage.style.display = 'block';
                    }

                    const allHeaders = results.meta.fields || Object.keys(results.data[0]);
                    const targetLower = TARGET_COLUMNS.map(c => c.toLowerCase());
                    const filteredHeaders = allHeaders.filter(h => targetLower.includes(h.toLowerCase()));

                    if (filteredHeaders.length === 0) {
                        alert('No se encontraron las columnas esperadas.\nBuscadas: ' + TARGET_COLUMNS.join(', '));
                        return;
                    }

                    const displayList = filteredHeaders.map(h => DISPLAY_NAMES[h] || h).join(', ');
                    shownColumnsList.textContent = displayList;
                    filterNote.style.display = 'block';

                    // Limpiar datos
                    allData = results.data.map(row => {
                        const newRow = {};
                        filteredHeaders.forEach(h => {
                            let val = row[h];
                            if (typeof val === 'string') {
                                val = cleanText(val);
                            }
                            newRow[h] = val;
                        });
                        return newRow;
                    });

                    currentHeaders = filteredHeaders;
                    visibleHeaders = [...currentHeaders];
                    sortConfig = { column: null, direction: 'asc' };
                    filterValues = {};
                    // Inicializar filtros vacíos
                    currentHeaders.forEach(h => filterValues[h] = '');

                    // Construir los selectores de filtro
                    buildFilters(allData, currentHeaders);
                    // Construir la tabla
                    buildTable(allData, visibleHeaders);
                    tableContainer.style.display = 'flex';
                },
                error: function(error) {
                    alert('Error al leer el archivo: ' + error.message);
                }
            });
        }

        // ---------- CONSTRUIR FILTROS (SELECTORES) ----------
        function buildFilters(data, headers) {
            filtersRow.innerHTML = '';
            // Para cada columna, obtener valores únicos y crear select
            headers.forEach(h => {
                const displayName = DISPLAY_NAMES[h] || h;
                // Obtener valores únicos no nulos
                const uniqueValues = new Set();
                data.forEach(row => {
                    const val = row[h];
                    if (val !== null && val !== undefined && val !== '') {
                        uniqueValues.add(String(val));
                    }
                });
                const sortedValues = Array.from(uniqueValues).sort((a, b) => a.localeCompare(b));

                const label = document.createElement('label');
                label.innerHTML = `${displayName}: `;

                const select = document.createElement('select');
                // Opción "Todos"
                const allOption = document.createElement('option');
                allOption.value = '';
                allOption.textContent = 'Todos';
                select.appendChild(allOption);

                sortedValues.forEach(v => {
                    const opt = document.createElement('option');
                    opt.value = v;
                    opt.textContent = v;
                    select.appendChild(opt);
                });

                // Evento cambio
                select.addEventListener('change', function() {
                    filterValues[h] = this.value;
                    applyFiltersAndRender();
                });

                label.appendChild(select);
                filtersRow.appendChild(label);
            });

            // Botón para limpiar todos los filtros
            const clearBtn = document.createElement('button');
            clearBtn.className = 'clear-filters-btn';
            clearBtn.textContent = '✕ Limpiar filtros';
            clearBtn.addEventListener('click', function() {
                // Resetear todos los selects a "Todos"
                const selects = filtersRow.querySelectorAll('select');
                selects.forEach(sel => sel.value = '');
                // Resetear filterValues
                headers.forEach(h => filterValues[h] = '');
                applyFiltersAndRender();
            });
            filtersRow.appendChild(clearBtn);
        }

        // ---------- APLICAR FILTROS Y RENDERIZAR ----------
        function applyFiltersAndRender() {
            // Filtrar datos según filterValues
            const filteredData = allData.filter(row => {
                for (let h of currentHeaders) {
                    const filterVal = filterValues[h] || '';
                    if (filterVal === '') continue;
                    const cellVal = row[h] !== null && row[h] !== undefined ? String(row[h]) : '';
                    if (cellVal !== filterVal) {
                        return false;
                    }
                }
                return true;
            });

            // Aplicar ordenamiento (si existe)
            let sortedData = filteredData;
            if (sortConfig.column) {
                const col = sortConfig.column;
                const dir = sortConfig.direction;
                sortedData = [...filteredData].sort((a, b) => {
                    let valA = a[col] ?? '';
                    let valB = b[col] ?? '';
                    if (typeof valA === 'number' && typeof valB === 'number') {
                        return dir === 'asc' ? valA - valB : valB - valA;
                    }
                    valA = String(valA).toLowerCase();
                    valB = String(valB).toLowerCase();
                    if (valA < valB) return dir === 'asc' ? -1 : 1;
                    if (valA > valB) return dir === 'asc' ? 1 : -1;
                    return 0;
                });
            }

            renderRows(sortedData);
        }

        // ---------- CONSTRUIR TABLA CON ORDEN AL CLIC EN ENCABEZADO ----------
        function buildTable(data, visibleCols) {
            let tableHtml = '<table><thead><tr>';
            visibleCols.forEach(h => {
                const displayName = DISPLAY_NAMES[h] || h;
                tableHtml += `<th data-column="${h}">${displayName} <span class="sort-icon">↕</span></th>`;
            });
            tableHtml += '</tr></thead><tbody id="tableBody">';
            tableHtml += '</tbody></table>';

            tableWrapper.innerHTML = tableHtml;

            // Evento de orden al hacer clic en el encabezado
            document.querySelectorAll('thead th').forEach(th => {
                th.addEventListener('click', function() {
                    const col = this.dataset.column;
                    // Alternar dirección
                    if (sortConfig.column === col) {
                        sortConfig.direction = sortConfig.direction === 'asc' ? 'desc' : 'asc';
                    } else {
                        sortConfig.column = col;
                        sortConfig.direction = 'asc';
                    }
                    applyFiltersAndRender();
                    // Actualizar ícono de orden
                    updateSortIcons(col);
                });
            });

            renderRows(data);
        }

        // ---------- ACTUALIZAR ICONOS DE ORDEN ----------
        function updateSortIcons(activeCol) {
            document.querySelectorAll('thead th .sort-icon').forEach(icon => {
                const th = icon.closest('th');
                const col = th.dataset.column;
                if (col === activeCol) {
                    icon.textContent = sortConfig.direction === 'asc' ? ' ▲' : ' ▼';
                } else {
                    icon.textContent = ' ↕';
                }
            });
        }

        // ---------- RENDERIZAR FILAS ----------
        function renderRows(data) {
            const tbody = document.getElementById('tableBody');
            if (!tbody) return;

            let html = '';
            if (data.length === 0) {
                html = `<tr><td colspan="${visibleHeaders.length}" style="text-align:center; padding:20px; color:#889bb3;">No hay datos que coincidan con los filtros</td></tr>`;
            } else {
                data.forEach(row => {
                    html += '<tr>';
                    visibleHeaders.forEach(h => {
                        let val = row[h];
                        if (val === null || val === undefined) val = '';
                        let str = String(val);
                        if (str.length > 50) str = str.substring(0, 47) + '…';
                        html += `<td title="${String(val).replace(/"/g, '&quot;')}">${str}</td>`;
                    });
                    html += '</tr>';
                });
            }
            tbody.innerHTML = html;

            // Actualizar íconos de orden si hay columna activa
            if (sortConfig.column) {
                updateSortIcons(sortConfig.column);
            }
        }

    })();
</script>
</body>
</html>
